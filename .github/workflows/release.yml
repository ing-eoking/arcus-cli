name: Release

# Pushing a tag such as v1.1.0 builds arcus-cli for each platform and
# attaches the archives to the GitHub release of that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are built with cargo-zigbuild against glibc 2.28 so they also load on RHEL 8/9.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            zigbuild: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: matrix.zigbuild
        run: |
          python3 -m pip install --user ziglang==0.13.0
          cargo install cargo-zigbuild --version 0.19.8 --locked
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Build (glibc 2.28)
        if: matrix.zigbuild
        env:
          ARCUS_CLI_TAG: ${{ github.ref_name }}
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.28

      - name: Build
        if: ${{ !matrix.zigbuild }}
        env:
          ARCUS_CLI_TAG: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check glibc symbol version
        if: matrix.zigbuild
        run: |
          max=$(objdump -T "target/${{ matrix.target }}/release/arcus-cli" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "max GLIBC symbol version: $max"
          [ "$(printf '%s\nGLIBC_2.34\n' "$max" | sort -V | tail -1)" = "GLIBC_2.34" ] || { echo "requires $max, above GLIBC_2.34"; exit 1; }

      - name: Package
        shell: bash
        run: |
          name="arcus-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/arcus-cli" README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            arcus-cli-*.tar.gz
            arcus-cli-*.tar.gz.sha256
